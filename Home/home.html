<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - MTech Thesis</title>
    <!-- Root global styles -->
    <link rel="stylesheet" href="../styles.css" />

    <link rel="stylesheet" href="home.css" />
  </head>
  <body class="home-page-body">
    <!-- Container where global top navbar will render -->
    <div id="navbar-container"></div>

    <main class="page-content home-container">
      <!-- Section 1: Thesis -->
      <section class="home-section thesis-section">
        <div class="project-item">
          <div class="project-header">
            <div class="project-title-wrap">
              <a href="Projects/Thesis/thesis.html" class="project-title-link">
                <span class="project-name">Thesis Work</span></a
              ><br />
              <span
                >Characterization of Interference Pattern on Liquid Sheet to
                Produce Dynamically Controlled Traveling Plasma Grating for
                Relativistic SHHG</span

            </div>
            <div class="progress-badge">
              <span class="badge-num">20</span>
              <span class="badge-pct">%</span>
            </div>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width: 20%"></div>
          </div>
        </div>

      <section class="home-section mini-projects-section">
        <h2 class="section-title">Mini-Projects</h2>
        <div class="projects-list">

          <div class="project-item">
            <div class="project-header">
              <div class="project-title-wrap">
                <a href="Projects/ESM/esm.html" class="project-title-link">
                  <span class="project-name">Electron Spectrometer</span>
                </a>
              </div>
              <div class="progress-badge">
                <span class="badge-num">60</span>
                <span class="badge-pct">%</span>
              </div>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: 60%"></div>
            </div>
          </div>

          <!-- Project 2 -->
          <div class="project-item">
            <div class="project-header">
              <div class="project-title-wrap">
                <a

                  <span class="project-name"

              </div>
              <div class="progress-badge">
                <span class="badge-num">50</span>

              </div>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: 50%"></div>

          <!-- Project 3 -->
          <div class="project-item">
            <div class="project-header">

                  <span class="project-name">PW Lab Assembly and Setup</span></a

              </div>
              <div class="progress-badge">
                <span class="badge-num">30</span>
                <span class="badge-pct">%</span>
              </div>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: 30%"></div>
            </div>
          </div>
        </div>
      </section>

      loadNavbar("../");
